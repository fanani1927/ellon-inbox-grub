<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Generator Lisensi Ellon</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background-color: #1e293b;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
        border: 1px solid #334155;
      }
      h2 {
        color: #3b82f6;
        margin-top: 0;
        margin-bottom: 25px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      input {
        width: 90%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #475569;
        background-color: #0f172a;
        color: white;
        font-family: monospace;
        outline: none;
      }
      input:focus {
        border-color: #3b82f6;
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background-color: #10b981;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover {
        background-color: #059669;
      }
      #hasil {
        margin-top: 20px;
        font-size: 14px;
        font-weight: bold;
        padding: 10px;
        border-radius: 6px;
        display: none;
      }
      .sukses {
        background-color: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid #059669;
      }
      .gagal {
        background-color: rgba(244, 63, 94, 0.2);
        color: #fb7185;
        border: 1px solid #e11d48;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>ELLON KEY GEN</h2>
      <!-- Ganti value di bawah jika kamu mengubah adminKey di Cloudflare Worker -->
      <input
        type="password"
        id="adminKey"
        value="ELLON_ADMIN_123"
        placeholder="Password Admin"
      />
      <input
        type="text"
        id="newLicense"
        placeholder="Ketik Lisensi (Contoh: VIP-ELLON-99)"
      />
      <button onclick="buatLisensi()" id="btnSubmit">GENERATE LISENSI</button>
      <div id="hasil"></div>
    </div>

    <script>
      async function buatLisensi() {
        const adminKey = document.getElementById("adminKey").value;
        const license = document.getElementById("newLicense").value;
        const hasilDiv = document.getElementById("hasil");
        const btn = document.getElementById("btnSubmit");

        if (!license) return alert("Harap isi kode lisensi!");

        btn.innerText = "MEMPROSES...";
        hasilDiv.style.display = "none";

        try {
          const response = await fetch(
            "https://ellon-license-api.fanzol633.workers.dev/create",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ adminKey: adminKey, license: license }),
            },
          );

          const data = await response.json();

          hasilDiv.style.display = "block";
          hasilDiv.innerText = data.msg;
          hasilDiv.className = data.success ? "sukses" : "gagal";

          if (data.success) document.getElementById("newLicense").value = "";
        } catch (err) {
          hasilDiv.style.display = "block";
          hasilDiv.innerText = "Gagal terhubung ke Cloudflare!";
          hasilDiv.className = "gagal";
        } finally {
          btn.innerText = "GENERATE LISENSI";
        }
      }
    </script>
  </body>
</html>
